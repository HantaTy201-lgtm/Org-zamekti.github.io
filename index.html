<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo-dark.png" />
    <title>Org — структурируй мысли, визуализируй идеи</title>
    <meta
      name="description"
      content="Org — рабочее пространство для заметок, канвасов и задач: связи как в Obsidian, доска как в Miro, базы как в Notion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('org.workspace.v1');
          if (raw) {
            var p = JSON.parse(raw);
            if (p && p.theme) {
              document.documentElement.dataset.theme = p.theme;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      setTimeout(() => {
        const root = document.getElementById('root');
        if (!root || !root.hasChildNodes()) {
          import('./assets/app.js');
          if (!document.querySelector('link[href*="app.css"]')) {
            const l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = './assets/app.css';
            document.head.appendChild(l);
          }
        }
      }, 50);
    </script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/app.png" />
    <title>Org — структурируй мысли, визуализируй идеи</title>
    <meta
      name="description"
      content="Org — рабочее пространство для заметок, канвасов и задач: связи как в Obsidian, доска как в Miro, базы как в Notion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('org.workspace.v1');
          if (raw) {
            var p = JSON.parse(raw);
            if (p && p.theme) {
              document.documentElement.dataset.theme = p.theme;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
